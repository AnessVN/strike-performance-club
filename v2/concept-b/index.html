function about(){return `${headerBlock('ONS VERHAAL','OVER <em>STRIKE.</em>','Geen doorsnee sportschool. Een plek voor mensen die willen groeien — fysiek, mentaal en met elkaar.','Max. 8 sporters per groep')}<section class="section"><div class="wrap story-grid"><div class="story-photo">${img('training-1.jpg')}<div class="photo-stamp">SAMEN.<br>STERKER.</div></div><div class="story-copy"><div class="eyebrow">WIE WIJ ZIJN</div><h2>JOUW POTENTIE.<br><em>ONZE FOCUS.</em></h2><p>Strike Performance Club draait om persoonlijke aandacht. We vinden dat ieder mens een omgeving verdient waar je kunt sporten, leren en sterker worden zonder op te gaan in de massa.</p><p>Onze manier van werken begint met luisteren. Waar sta je nu? Wat wil je bereiken? En welke training past bij jouw leven? Vanuit die vragen bouwen we aan een aanpak die je kunt volhouden.</p><p>Met kleine groepen, gerichte begeleiding en een duidelijke structuur wordt trainen geen verplichting, maar een moment waar je naar uitkijkt.</p>${btn('gratis-intake','Plan een gesprek ↗')}</div></div></section><section class="section section-contrast"><div class="wrap">${section('WAAR WE VOOR STAAN','VAN INTENTIE<br><em>NAAR RESULTAAT.</em>')}<div class="values-grid"><article><div class="big-symbol">01</div><h3>Aandacht</h3><p>Iedere sporter wordt gezien. Techniek, houding en ontwikkeling krijgen de ruimte die ze verdienen.</p></article><article><div class="big-symbol">02</div><h3>Discipline</h3><p>Door consistent te trainen maak je vooruitgang. Niet door alles perfect te doen, maar door te blijven komen.</p></article><article><div class="big-symbol">03</div><h3>Community</h3><p>De energie van een groep tilt je verder dan je vaak alleen zou gaan.</p></article></div></div></section><section class="section"><div class="wrap">${section('ZO VOELT DE CLUB','ECHTE ENERGIE.','We voegen na toestemming beelden van de echte sporters en coaches toe aan de definitieve website.')} ${photoWall()}<div class="stats-pieces"><div><b>MAX. 8</ is nog niet aangemaakt of aangesloten. De knoppen tonen daarom nu alleen koppelingsinformatie in plaats van een niet-bestaande checkout.</p></div></section>`}
function login(){const m=member();const reg=load(KEY,null);return `${headerBlock('LEDENOMGEVING','WELKOM <em>TERUG.</em>','Log in om je lessen te plannen, boekingen te bekijken en je voortgang bij te houden.')}<section class="section"><div class="wrap auth-layout"><div class="auth-card"><div class="eyebrow">STRIKE LEDENPORTAAL</div><h2>${m?'JE BENT INGELOGD.':'LOG IN.'}</h2>${m?`<div class="signedin"><div class="avatar">${esc(m.name[0].toUpperCase())}</div><div><strong>Hoi, ${esc(m.name.split(' ')[0])}!</strong><p>Je demo-lidmaatschap: ${esc(COSTS[m.plan].name)}</p></div></div>${link('leden','Mijn lessen openen ↗','btn btn-accent')}<button class="btn btn-outline" data-action="logout">Uitloggen</button>`:`<form id="login-form"><label>E-mailadres<input type="email" name="email" placeholder="jij@voorbeeld.nl" required autocomplete="email" value="${esc(reg?.email||'')}"></label><p class="form-hint">Presentatiedemo: toegang via het e-mailadres van het account dat je na een gesimuleerde abonnementbetaling hebt aangemaakt. Er wordt géén wachtwoord gebruikt of veilige login uitgevoerd.</p><button class="btn btn-accent btn-wide" type="submit">Demo: Log in ↗</button></form><p class="legal-note">Bij livegang: beveiligde wachtwoordloze login of een veilig ledenaccountsysteem.</p>`}</div><div class="auth-info"><div class="eyebrow">NOG GEEN LID?</div><h2>SCHRIJF JE IN.<br><em>TRAIN MEE.</em></h2><p>Bij Strike maak je pas een ledenaccount aan nadat een abonnement betaald en bevestigd is. Zo blijft de boekingsomgeving exclusief voor actieve leden.</p><div class="benefit-list"><span>✓ Kies flexibel, drie of zes maanden</span><span>✓ Inclusief je eigen reserveringsoverzicht</span><span>✓ Automatisch je naam bij je boeking</span><span>✓ Toegang tot ledenvoordeel in Shopify na verificatie</span></div>${btn('inschrijven','Schrijf mij in ↗')}</div></div></section>`}
function signup(){const params=getPage().params;const p=params.get('plan');if(p&&COSTS[p])signupPlan=p;return `${headerBlock('BEGIN MET STRIKE','SLUIT JE <em>ABONNEMENT</em> AF.','Je lidmaatschap wordt in de live website pas actief zodra Mollie de betaling via een webhook heeft bevestigd.')}<section class="section"><div class="wrap checkout-layout"><div class="checkout-form"><div class="eyebrow">STAP 1 / KIES JE PLAN</div><h2>JOUW<br>COMMITMENT.</h2><div class="plan-picker">${Object.entries(COSTS).map(([id,v])=>`<button type="button" class="plan-choice ${id===signupPlan?'selected':''}" data-action="pick-plan" data-plan="${id}"><b>${v.name}</b><span>€ ${v.amount} / mnd</span></button>`).join('')}</div><div class="upsell"><div><b>Strike bandages</b><p>€ 9,95 eenmalig, gratis bij zes maanden.</p></div><label class="switch-row"><input type="checkbox" id="bandage-check" ${signupPlan==='six'?'checked disabled':bandages?'checked':''}><span>${signupPlan==='six'?'GRATIS ✓':'Toevoegen'}</span></label></div><div class="eyebrow" style="margin-top:28px">STAP 2 / JOUW GEGEVENS</div><form id="signup-form"><div class="form-two"><label>Voor- en achternaam<input name="name" placeholder="Jouw volledige naam" required minlength="2" autocomplete="name"></label><label>E-mailadres<input type="email" name="email" placeholder="jij@voorbeeld.nl" required autocomplete="email"></label></div><label class="checkbox-line"><input type="checkbox" name="agree" required> Ik begrijp dat dit een demo is: er wordt geen geld afgeschreven, geen account beveiligd aangemaakt en geen bevestigingsmail verstuurd.</label><button class="btn btn-accent btn-wide" type="submit">Demo: betaling bevestigen & account openen ↗</button></form><div class="integration-note"><b>Hoe werkt de echte betaalflow?</b><p>Mollie Checkout → geverifieerde webhook → lidmaatschap actief in de database → uitnodiging voor beveiligde accountactivatie → e-mailbevestiging.</p></div></div><aside class="checkout-summary"><div class="eyebrow">JOUW OVERZICHT</div><h3 id="plan-summary-name">${COSTS[signupPlan].name}</h3><div class="sum-row"><span>Maandtermijn</span><b id="plan-monthly">€ ${COSTS[signupPlan].amount},00</b></div><div class="sum-row"><span>Minimale looptijd</span><b id="plan-duration">${signupPlan==='flex'?'Maandelijks opzegbaar':COSTS[signupPlan].term+' maanden'}</b></div><div class="sum-row"><span>Bandages, eenmalig</span><b id="plan-bands">${signupPlan==='six'?'Gratis':bandages?'€ 9,95':'Niet toegevoegd'}</b></div><div class="sum-row sum-total"><span>Indicatie eerste termijn</span><b id="plan-total">${money(COSTS[signupPlan].amount+(signupPlan==='six'||!bandages?0:9.95))}</b></div><p class="legal-note">Voorbeeldtarieven. Exacte incasso, wettelijke informatie, herroeping en voorwaarden vóór livegang aanvullen.</p></aside></div></section>`}
function memberships(){const m=member();const bookings=load(BOOKINGS,[]).filter(x=>m&&x.email===m.email);return `${headerBlock('JOUW PORTAAL','MIJN <em>LESSEN.</em>','Overzicht van je geplande lessen, reserveringen, wachtlijst en trainingsnotities.')}<section class="section"><div class="wrap">${m?`<div class="member-header"><div class="avatar">${esc(m.name[0].toUpperCase())}</div><div><span>INGELOGD ALS</span><h2>${esc(m.name)}</h2><p>Demo-lid · ${esc(COSTS[m.plan].name)} · ${esc(m.email)}</p></div><button data-action="logout" class="btn btn-outline">Uitloggen</button></div><div class="dashboard-grid"><div><div class="eyebrow">MIJN RESERVERINGEN</div><h2>VOLGENDE<br><em>TRAININGEN.</em></h2>${bookings.length?`<div class="bookings-list">${bookings.map(x=>`<div class="booking-row"><div><span class="booking-date">${esc(x.date)} · ${esc(x.time)}</span><h3>${esc(x.name)}</h3><p>${x.waitlist?'Op de wachtlijst':'Reservering bevestigd (alleen lokaal in demo)'}</p></div><button class="btn btn-ghost" data-action="cancel" data-key="${esc(x.key)}">Annuleer ×</button></div>`).join('')}</div>`:'<div class="empty-state"><div class="big-symbol">☷</div><h3>Nog geen lessen gepland</h3><p>Open het rooster en kies jouw volgende training.</p></div>'}${btn('lesrooster','Nieuwe les reserveren ↗')}</div><aside class="dashboard-side"><div class="eyebrow">JOUW ACCOUNT</div><h3>HALLO, ${esc(m.name.split(' ')[0]).toUpperCase()}!</h3><p>Je naam wordt straks automatisch gebruikt bij iedere reservering — je hoeft niet steeds opnieuw gegevens in te vullen.</p><div class="metric-line"><b>${bookings.filter(x=>!x.waitlist).length}</b><span>geplande lessen</span></div><div class="metric-line"><b>${load(LOG,[]).filter(x=>x.email===m.email).length}</b><span>trainingen in je log</span></div>${btn('trainingslog','Open mijn trainingslog ↗','secondary')}</aside></div>`:`<div class="locked"><div class="big-symbol">♙</div><h2>LOG EERST IN.</h2><p>Alleen leden met een actief demo-abonnement zien hier hun eigen lessen. Bij de echte website wordt dit beveiligd met accountauthenticatie.</p>${btn('login','Log in ↗')}${btn('inschrijven','Schrijf mij in ↗','secondary')}</div>`}</div></section>`}
function trainingLog(){const m=member();const logs=load(LOG,[]).filter(x=>m&&x.email===m.email);return `${headerBlock('JOUW VOORTGANG','TRAININGS<em>LOG.</em>','Elke training is een stap. Noteer je sessies en kijk terug op je ontwikkeling.')}<section class="section"><div class="wrap">${m?`<div class="dashboard-grid"><div class="auth-card"><div class="eyebrow">NIEUWE TRAINING</div><h2>LEG JE<br><em>SESSIE VAST.</em></h2><form id="log-form"><label>Soort training<select name="type" required><option>Kickboksen</option><option>Small group</option><option>Kracht & conditie</option><option>Personal training</option></select></label><label>Hoe zwaar was de training?<select name="level"><option>Rustig</option><option>Gemiddeld</option><option>Uitdagend</option><option>Heel intensief</option></select></label><label>Jouw notitie<textarea name="note" rows="4" placeholder="Wat ging er goed? Wat wil je verbeteren?"></textarea></label><button class="btn btn-accent btn-wide">Sla training op ↗</button></form></div><div><div class="eyebrow">JOUW HISTORIE</div><h2>${logs.length} <em>SESSIES.</em></h2><div class="bookings-list">${logs.length?logs.slice().reverse().map(l=>`<article class="booking-row"><div><span class="booking-date">${esc(l.date)} · ${esc(l.level)}</span><h3>${esc(l.type)}</h3><p>${esc(l.note)}</p></div></article>`).join(''):'<div class="empty-state"><h3>Je eerste training nog toevoegen</h3><p>Een klein begin is ook een begin.</p></div>'}</div></div></div>`:`<div class="locked"><h2>EERST <em>INLOGGEN.</em></h2><p>Je trainingslog is onderdeel van je ledenomgeving.</p>${btn('login','Log in ↗')}</div>`}</div></section>`}
function roster(){const m=member();const weekStart=monday(weekIndex);const filterNames=['Alles','Kickboksen','Small group','Kracht','Conditie','Ladies Only','Kids','Herstel'];const d=dateBy(weekIndex,dayIndex);const items=WEEK[dayIndex].filter(c=>catFilter==='Alles'||c[2]===catFilter);const bookings=load(BOOKINGS,[]);return `${headerBlock('PLAN JE TRAINING','LES<em>ROOSTER.</em>','Bekijk de tijden, hoeveel plekken er vrij zijn en reserveer met je ledenaccount. Volle les? Meld je aan voor de wachtlijst.')}<section class="section"><div class="wrap"><div class="roster-toolbar"><div><div class="eyebrow">JOUW WEEK</div><h2>${dFmt(weekStart,{day:'numeric',month:'short'})} – ${dFmt(dateBy(weekIndex,6),{day:'numeric',month:'short',year:'numeric'})}</h2><p>Alle tijden zijn voorbeeldlessen. Bezetting is niet live gekoppeld.</p></div><div class="week-actions"><button data-action="prev-week" ${weekIndex<=0?'disabled':''} class="btn btn-ghost" aria-label="Vorige week">←</button><button data-action="this-week" class="btn btn-ghost">Deze week</button><button data-action="next-week" ${weekIndex>=6?'disabled':''} class="btn btn-ghost" aria-label="Volgende week">→</button></div></div><div class="days">${DAYS.map((x,i)=>`<button class="day ${i===dayIndex?'active':''}" data-action="day" data-day="${i}"><b>${x}</b><span>${dateBy(weekIndex,i).getDate()}</span></button>`).join('')}</div><div class="filter-row"><span>Filter training:</span><div class="filter-items">${filterNames.map(s=>`<button class="filter-btn ${catFilter===s?'active':''}" data-action="filter" data-cat="${s}">${s}</button>`).join('')}</div></div><div class="roster-title"><h3>${DNF[dayIndex].toUpperCase()} ${dFmt(d)}</h3><span>◎ Maximaal 8 sporters per groep</span></div><div class="lessons">${items.length?items.map((c,i)=>{const key=localDate(d)+'_'+c[0]+'_'+c[1].replace(/\W/g,''); const mine=bookings.find(x=>x.key===key&&m&&x.email===m.email);const extra=bookings.filter(x=>x.key===key&&!x.waitlist).length; const taken=Math.min(c[3],c[4]+extra),free=c[3]-taken;const old=d.toDateString()===today().toDateString()&&Number(c[0].split(':')[0])<today().getHours()||d<new Date(new Date().setHours(0,0,0,0));return `<article class="lesson ${free===0?'is-full':''}"><div class="lesson-time"><strong>${c[0]}</strong><small>60 min.</small></div><div class="lesson-name"><h3>${esc(c[1])}</h3><p>${esc(c[2])} · Geschikt voor aangegeven niveau</p></div><div class="capacity"><span class="cap-label ${free?'green':'red'}">${free?free+' plekken vrij':'VOL / WACHTLIJST'}</span><div class="cap-bar"><i style="width:${100*taken/c[3]}%"></i></div><small>${taken} van ${c[3]} aangemeld</small></div><div class="lesson-action">${mine?`<button class="btn btn-outline" data-action="cancel" data-key="${key}">${mine.waitlist?'Op wachtlijst':'Gereserveerd ✓'}</button>`:`<button ${old?'disabled':''} class="btn ${free?'btn-accent':'btn-outline'}" data-action="reserve" data-key="${key}" data-date="${localDate(d)}" data-time="${c[0]}" data-name="${esc(c[1])}" data-full="${free===0?'1':'0'}">${old?'Afgelopen':free?'Reserveer mijn plek ↗':'Wachtlijst ↗'}</button>`}</div></article>`}).join(''):'<div class="empty-state">Geen lessen voor dit filter op deze dag. Kies een andere categorie.</div>'}</div><div class="roster-after"><div><h3>ZO WERKT RESERVEREN</h3><p>1. Kies je les. 2. Log in (of schrijf je in). 3. Je naam staat automatisch klaar. 4. Bevestig de reservering. Een echte bevestigingsmail volgt na aansluiting van de mailservice.</p></div>${link(m?'leden':'login',m?'Mijn reserveringen ↗':'Log in om te reserveren ↗','btn btn-outline')}</div></div></section>`}

r doorgestuurd en geen e-mail verzonden.</p></div><div class="auth-info"><div class="eyebrow">EERST EVEN KENNISMAKEN</div><h2>${contact?'SAMEN KOMEN WE':'DE EERSTE STAP'}<br><em>${contact?'VERDER.':'IS GRATIS.'}</em></h2><p>Je kunt ons alles vragen over de lessen, onze aanpak en de beste start voor jou. Je hoeft geen wedstrijdervaring te hebben.</p><ul class="tick-list"><li>Rustige uitleg en een fijne eerste kennismaking</li><li>Kleine groepen met persoonlijke begeleiding</li><li>Ook voor beginners zonder sportachtergrond</li><li>Gratis intake en kennismakingsopties</li></ul><div class="contact-note"><b>CONTACTGEGEVENS</b><span>Veenendaal · adres en telefoon ter bevestiging</span><span>De definitieve contactgegevens worden vóór publicatie ingevuld.</span></div></div></div></section>`}

function toast(t){const el=$('#toast');if(!el)return;el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4800)}
function dialog(title,body,actions=''){const el=$('#modal');el.innerHTML=`<div class="dialog-back" data-action="close-modal"><div class="dialog-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}" onclick="event.stopPropagation()"><button class="dialog-x" data-action="close-modal" aria-label="Sluiten">×</button><div class="eyebrow">STRIKE PERFORMANCE CLUB</div><h2>${title}</h2><div class="dialog-body">${body}</div><div class="dialog-actions">${actions||'<button class="btn btn-accent" data-action="close-modal">Sluiten ↗</button>'}</div></div></div>`}
function newBooking(b){selectedClass=b;const m=member();if(!m){pendingBooking=b;try{sessionStorage.setItem('strike-pending',JSON.stringify(b))}catch{}go('login');return}const full=b.full==='1';dialog(full?'WACHTLIJST.':'BEVESTIG JE PLEK.',`<div class="reservation-detail"><span>LESSENOVERZICHT</span><h3>${esc(b.name)}</h3><p>${esc(b.date)} · ${esc(b.time)} uur · 60 minuten</p><p>${full?'De les is vol. Je kunt jezelf aanmelden voor de wachtlijst.':'Er is nog plek voor deze les.'}</p><div class="member-line">Deelnemer: <b>${esc(m.name)}</b><br>E-mailadres: ${esc(m.email)}</div><small>Demo: deze reservering wordt alleen op dit apparaat opgeslagen. Er wordt nog geen e-mail verstuurd.</small></div>`,`<button class="btn btn-accent" data-action="confirm-booking">${full?'Plaats mij op de wachtlijst':'Bevestig reservering'} ↗</button><button class="btn btn-outline" data-action="close-modal">Annuleren</button>`)}
function go(page,query=''){location.href=path(page,query);if(isSingle&&location.hash==='#'+page){render()}}
function finishBooking(){const m=member(),b=selectedClass;if(!m||!b)return;const current=load(BOOKINGS,[]);if(current.some(x=>x.key===b.key&&x.email===m.email)){dialog('AL GERESERVEERD','Je staat al ingeschreven voor deze les.');return}const record={...b,email:m.email,waitlist:b.full==='1'};save(BOOKINGS,[...current,record]);selectedClass=null;render();dialog('RESERVERING IN DEMO VASTGELEGD.',`<div class="mail-example"><b>Voorbeeld van de automatische bevestigingsmail</b><p>Onderwerp: Je Strike-reservering is bevestigd</p><p>Hoi ${esc(m.name.split(' ')[0])},<br>Je ${record.waitlist?'aanmelding voor de wachtlijst':'plek'} voor <strong>${esc(record.name)}</strong> op <strong>${esc(record.date)} om ${esc(record.time)} uur</strong> is in deze demo opgeslagen.</p><p>In de live versie ontvang je dit per e-mail en zien alle leden dezelfde actuele bezetting.</p></div>`,`<button class="btn btn-accent" data-action="go-members">Bekijk mijn lessen ↗</button><button class="btn btn-outline" data-action="close-modal">Sluiten</button>`)}
function updateTotals(){const s=COSTS[signupPlan],b=signupPlan==='six'||bandages;$('#plan-summary-name').textContent=s.name;$('#plan-monthly').textContent=money(s.amount);$('#plan-duration').textContent=signupPlan==='flex'?'Maandelijks opzegbaar':s.term+' maanden';$('#plan-bands').textContent=signupPlan==='six'?'Gratis':b?'€ 9,95':'Niet toegevoegd';$('#plan-total').textContent=money(s.amount+(signupPlan!=='six'&&bandages?9.95:0));const check=$('#bandage-check');if(check){check.checked=b;check.disabled=signupPlan==='six'}$$('.plan-choice').forEach(el=>el.classList.toggle('selected',el.dataset.plan===signupPlan))}
root.addEventListener('click',e=>{const bt=e.target.closest('[data-action]');if(!bt)return;const x=bt.dataset.action; if(x==='toggle-menu'){const m=$('#mobile-nav');m.classList.toggle('open');bt.setAttribute('aria-expanded',m.classList.contains('open'));return}
if(x==='close-modal'){$('#modal').innerHTML='';return}
if(x==='shop-link'){dialog('SHOPIFY-WINKEL VOLGT.',`<p>De shop komt op <strong>shop.strikeperformanceclub.nl</strong>. Zodra de winkel bestaat, leiden de knoppen rechtstreeks naar echte Shopify-productpagina’s en de veilige Shopify-checkout.</p><p>De 5% ledenkorting moet worden toegekend via een veilig geverifieerde actieve lidstatus, niet alleen via een kortingscode in de browser.</p>`);return}
if(x==='pick-plan'){signupPlan=bt.dataset.plan;updateTotals();return}
if(x==='prev-week'||x==='next-week'||x==='this-week'){weekIndex=x==='this-week'?0:Math.max(0,Math.min(6,weekIndex+(x==='next-week'?1:-1)));render();return}
if(x==='day'){dayIndex=+bt.dataset.day;render();return}
if(x==='filter'){catFilter=bt.dataset.cat;render();return}
if(x==='reserve'){newBooking({...bt.dataset,full:bt.dataset.full});return}
if(x==='confirm-booking'){finishBooking();return}
if(x==='go-members'){$('#modal').innerHTML='';go('leden');return}
if(x==='cancel'){const m=member();if(!m)return;save(BOOKINGS,load(BOOKINGS,[]).filter(b=>!(b.email===m.email&&b.key===bt.dataset.key)));render();toast('Je demo-reservering is geannuleerd.');return}
if(x==='logout'){remove(SESSION);render();toast('Je bent uitgelogd uit de demo.');return}
});
root.addEventListener('change',e=>{if(e.target.id==='bandage-check'){bandages=e.target.checked;updateTotals()}});
root.addEventListener('submit',e=>{if(!['login-form','signup-form','lead-form','log-form'].includes(e.target.id))return;e.preventDefault();const f=e.target,fd=new FormData(f);
if(f.id==='signup-form'){let email=String(fd.get('email')).trim().toLowerCase(),name=String(fd.get('name')).trim();const a={email,name,plan:signupPlan,bandages:signupPlan==='six'||bandages,created:new Date().toISOString(),status:'DEMO'};save(KEY,a);save(SESSION,{email});toast('Demo-abonnement geactiveerd; er is géén betaling uitgevoerd.');go('leden');return}
if(f.id==='login-form'){const a=load(KEY,null),email=String(fd.get('email')).trim().toLowerCase();if(!a||a.email!==email){dialog('GEEN DEMO-ACCOUNT GEVONDEN.','Schrijf je eerst in en rond de gesimuleerde abonnementbetaling af. Deze login werkt alleen op het apparaat waarop je de demo-inschrijving hebt gedaan.','<button class="btn btn-accent" data-action="go-signup">Schrijf mij in ↗</button>');return}save(SESSION,{email});let pending=pendingBooking;try{pending=pending||JSON.parse(sessionStorage.getItem('strike-pending')||'null');sessionStorage.removeItem('strike-pending')}catch{}pendingBooking=null;if(pending){selectedClass=null;go('lesrooster');setTimeout(()=>newBooking(pending),200)}else{go('leden')}return}
if(f.id==='lead-form'){const who=esc(fd.get('name')),name=f.dataset.kind;dialog('AANVRAAGVOORBEELD.',`<p>Dank je, ${who}! Dit is een <b>presentatiedemo</b>: jouw ${name==='proefles'?'gratis proefles':name==='intake'?'gratis intake':'contactbericht'} is niet echt verstuurd of geboekt.</p><p>Na de koppeling met de mailservice ontvangt de aanvrager automatisch een bevestigingsmail. De club ontvangt een melding en kan de aanvraag verwerken.</p>`);f.reset();return}
if(f.id==='log-form'){const m=member();if(!m)return;save(LOG,[...load(LOG,[]),{email:m.email,date:dFmt(today(),{day:'numeric',month:'long',year:'numeric'}),type:fd.get('type'),level:fd.get('level'),note:String(fd.get('note')).slice(0,500)}]);render();toast('Training toegevoegd aan je lokale demo-log.');return}
});
root.addEventListener('click',e=>{const bt=e.target.closest('[data-action="go-signup"]');if(bt){go('inschrijven')}});
window.addEventListener('hashchange',()=>{if(isSingle){weekIndex=0;catFilter='Alles';render()}});
render();
})();
</script></body></html>
