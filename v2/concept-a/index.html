function about(){return `${headerBlock('ONS VERHAAL','OVER <em>STRIKE.</em>','Geen doorsnee sportschool. Een plek voor mensen die willen groeien: fysiek, mentaal en met elkaar.','Kerkewijk 68 · Veenendaal')}<section class="section"><div class="wrap story-grid"><div class="story-photo">${img('team.jpg')}<div class="photo-stamp">SAMEN.<br>STERKER.</div></div><div class="story-copy"><div class="eyebrow">WIE WIJ ZIJN</div><h2>NEW NAME.<br><em>SAME MISSION.</em></h2><p>Strike Performance Club is de nieuwe naam van Coaching by Abood. Sinds november 2026 trainen we in onze gloednieuwe gym aan de Kerkewijk 68 in Veenendaal. Nieuwe naam, zelfde missie: jou sterker maken, in de ring en erbuiten.</p><p>Strike draait om persoonlijke aandacht. We vinden dat ieder mens een omgeving verdient waar je kunt sporten, leren en sterker worden zonder op te gaan in de massa.</p><p>Onze manier van werken begint met luisteren. Waar sta je nu? Wat wil je bereiken? En welke training past bij jouw leven? Vanuit die vragen bouwen we aan een aanpak die je kunt volhouden.</p>${btn('gratis-proefles','Plan een gratis proefles ↗')}</div></div></section><section class="section section-contrast"><div class="wrap">${section('WAAR WE VOOR STAAN','VAN INTENTIE<br><em>NAAR RESULTAAT.</em>')}<div class="values-grid"><article><div class="big-symbol">01</div><h3>Aandacht</h3><p>Iedere sporter wordt gezien. Techniek, houding en ontwikkeling krijgen de ruimte die ze verdienen.</p></article><article><div class="big-symbol">02</div><h3>Discipline</h3><p>Door consistent te trainen maak je vooruitgang. Niet door alles perfect te doen, maar door te blijven komen.</p></article><article><div class="big-symbol">03</div><h3>Community</h3><p>De energie van een groep tilt je verder dan je vaak alleen zou gaan.</p></article></div></div></section><section class="section section-proof"><div class="wrap">${section('SOCIAAL BEWIJS','WAT SPORTERS<br><em>ERVAREN.</em>')} ${reviewCards()}</div></section>${igSection(16,'INSTAGRAM function method(){const steps=[['01','Kennismaking','We beginnen met jouw doelen, ervaring, uitdagingen en voorkeur voor dagen of tijden. Je hoeft niets voor te bereiden.'],['02','Gratis proefles','Maak kennis met een coach, ervaar de groepsgrootte en ontdek of de sfeer bij jou past.'],['03','Jouw route','We adviseren een trainingsvorm en frequentie die passen bij je niveau en beschikbare tijd.'],['04','Inschrijven','Kies je abonnement. Na de echte betaling wordt automatisch je veilige ledenaccount geactiveerd.'],['05','Lessen plannen','Log in, bekijk de actuele bezetting en reserveer je eigen plek in het rooster.'],['06','Groei bijhouden','Evalueer je ontwikkeling, bespreek je doelen en maak je trainingen steeds gerichter.']];return `${headerBlock('ONZE AANPAK','ZO WERKT <em>STRIKE.</em>','Geen vage beloftes. Een helder traject van de eerste kennismaking tot je volgende trainingsdoel.')}<section class="section"><div class="wrap">${section('DE ROUTE','ZES STAPPEN.<br><em>ÉÉN RICHTING.</em>')}<div class="method-grid">${steps.map(s=>`<article class="method-card"><span>${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p></article>`).join('')}</div></div></section><section class="section section-contrast"><div class="wrap story-grid"><div class="story-copy"><div class="eyebrow">VOOR ELK NIVEAU</div><h2>JE HOEFT NOG<br>NIETS TE <em>KUNNEN.</em></h2><p>Een eerste training kan spannend zijn. Daarom leggen we oefeningen helder uit, passen we de intensiteit aan en zorgen we dat je veilig kunt starten.</p><ul class="tick-list"><li>Een trainer die corrigeert waar nodig</li><li>Training op basis van jouw belastbaarheid</li><li>Ruimte om vragen te stellen</li><li>Een overzichtelijk rooster zonder gedoe</li></ul>${btn('gratis-proefles','Probeer het gratis ↗')}</div><div class="story-photo">${img('training-3.jpg')}</div></div></section>`}
function trainingPage(){const blocks=[
 ['kids','Kids training','4 t/m 11 jaar','kids.jpg',`<p>Elke leeftijd traint anders. Daarom zijn de kids- en jeugdlessen verdeeld in drie groepen, zodat elk kind op zijn eigen niveau aan de slag gaat.</p><div class="age-grid"><div><b>4 tot 6 jaar: spelenderwijs beginnen</b><p>De eerste kennismaking met kickboksen draait om bewegen en plezier. Met spelletjes en korte oefeningen leren de kleintjes hun eerste stoten en trappen, luisteren naar de trainer en samen oefenen. Ondertussen rennen en springen ze hun energie eruit.</p></div><div><b>7 tot 11 jaar: techniek en vertrouwen</b><p>Hier wordt kickboksen een echte sport. De kinderen leren stoten en trappen steeds netter uitvoeren en oefenen combinaties. Ze leren ook kalm blijven, rekening houden met anderen en doorgaan als iets niet meteen lukt.</p></div></div>`],
 ['jeugd','Jeugd training','12 t/m 16 jaar','jeugd.jpg',`<p><b>12 tot 16 jaar: sterker en scherper.</b> Tieners trainen met meer tempo, meer techniek en meer aandacht voor kracht en conditie. De lessen draaien om focus, zelfbeheersing en zelfvertrouwen, en er is ruimte voor wie echt beter wil worden.</p>`],
 ['kickboksen','Kickboksen','15+','kickboksen.jpg',`<p>Tijdens deze groepstraining richten we ons op het verfijnen van je technieken, het vergroten van explosiviteit en het versterken van je spieren. Onze groepstrainingen zijn zeer gevarieerd: om de sessies interessant te houden, variëren we de opbouw van de lessen.</p><p>Toch bevatten alle sessies een vaste basis: warming-up, techniekverbetering, kracht- en cardiotraining en stretchoefeningen.</p>`],
 ['bokszak','Bokszaktraining','Alle niveaus','bokszak.jpg',`<p>Alleen jij, de zak en het ritme van de rondes. Bij bokszaktraining werk je aan stoten, trappen en conditie, in een tempo dat je zelf bepaalt. Daardoor kun je ook zonder ervaring meteen instappen.</p><p>Je hoeft niemand te verslaan, alleen jezelf van vorige week. Elke ronde slaat je techniek iets scherper aan en je uithoudingsvermogen groeit mee.</p><p>Na de laatste ronde ben je moe en is je hoofd leeg. Dat maakt het ook een goede training na een drukke werkdag. Doe een keer mee.</p>`],
 ['ladies','Ladies Only','Voor vrouwen','ladies.jpg',`<p>Een moment voor jezelf, tussen vrouwen die ook komen om te trainen. Ladies Only is een kickboksles met alleen vrouwen, in een ontspannen sfeer en zonder haast. Je leert stoten, trappen en verdedigen in je eigen tempo, gecombineerd met lichaamsoefeningen.</p><p>Word stap voor stap sterker en fitter. Ervaring heb je niet nodig, want iedereen begint waar ze staat. Probeer een Ladies Only-les en kijk hoe het voelt.</p>`]

function roster(){return `${headerBlock('PLAN JE TRAINING','LES<em>ROOSTER.</em>','Bekijk het actuele rooster en reserveer je plek via de Strike-app. Nieuw bij ons? Plan eerst een gratis proefles.','<strong>RESERVEREN</strong><br>via de Strike-app')}<section class="section"><div class="wrap"><div class="roster-toolbar"><div><div class="eyebrow">ACTUEEL ROOSTER</div><h2>DEZE WEEK<br><em>BIJ STRIKE.</em></h2><p>Het rooster hieronder komt rechtstreeks uit onze planningsapp en is altijd actueel.</p></div><div class="week-actions"><a class="btn btn-accent" href="${APP_URL}" target="_blank" rel="noopener">Reserveer in de app ↗</a>${btn('gratis-proefles','Gratis proefles ↗','secondary')}</div></div><div class="rooster-embed"><iframe src="${WIDGET_URL}" title="Lesrooster Strike Performance Club" loading="lazy"></iframe></div><div class="roster-after"><div><h3>ZO WERKT RESERVEREN</h3><p>1. Kies je les in het rooster. 2. Log in op de Strike-app of maak een account aan. 3. Reserveer je plek. Je ontvangt je bevestiging vanuit de app.</p></div><a class="btn btn-outline" href="${APP_URL}" target="_blank" rel="noopener">Open de Strike-app ↗</a></div></div></section>`}
function contactCards(){return `<div class="contact-cards"><a href="${CONTACT.maps}" target="_blank" rel="noopener"><b>ADRES</b><span>${esc(CONTACT.adres)}, ${esc(CONTACT.postcode)} ${esc(CONTACT.plaats)}</span></a><a href="tel:${CONTACT.tel}"><b>TELEFOON</b><span>${esc(CONTACT.telefoon)}</span></a><a href="https://wa.me/${CONTACT.tel.replace('+','')}" target="_blank" rel="noopener"><b>WHATSAPP</b><span>Stuur ons een appje</span></a><a href="mailto:${CONTACT.email}"><b>E-MAIL</b><span>${esc(CONTACT.email)}</span></a></div>`}
function formPage(kind){const contact=kind==='contact';return `${headerBlock(contact?'WIJ HOREN GRAAG VAN JE':'ZET DE EERSTE STAP',contact?'NEEM <em>CONTACT</em> OP.':'JOUW EERSTE <em>RONDE</em> IS GRATIS.',contact?'Een vraag over de lessen, het rooster of je lidmaatschap? Bel, app of mail ons. We reageren zo snel mogelijk.':'Nieuw bij Strike? Train een keer gratis mee en ervaar zelf hoe het voelt om in een kleine groep met echte aandacht te trainen.')}<section class="section"><div class="wrap auth-layout"><div class="auth-card"><div class="eyebrow">${contact?'CONTACT':'GRATIS PROEFLES'}</div><h2>${contact?'ZO BEREIK<br><em>JE ONS.</em>':'ZO MELD JE<br><em>JE AAN.</em>'}</h2>${contact?contactCards()+`<a class="btn btn-accent btn-wide" href="${APP_URL}" target="_blank" rel="noopener">Log in op de Strike-app ↗</a>`:`<div class="step-list"><div><b>01</b><div><h3>Kies een les</h3><p>Bekijk het rooster en kies de training die bij je past: kids, jeugd, kickboksen, bokszak of Ladies Only.</p></div></div><div><b>02</b><div><h3>Meld je aan via de app</h3><p>Maak gratis een account aan in de Strike-app en reserveer je proefles.</p></div></div><div><b>03</b><div><h3>Kom trainen</h3><p>Kom in sportkleding en neem water mee. Je eerste les is gratis en vrijblijvend.</p></div></div></div><a class="btn btn-accent btn-wide" href="${APP_URL}" target="_blank" rel="noopener">Plan mijn gratis proefles ↗</a><p class="legal-note">Liever even overleggen? Bel of app ons op <a href="tel:${CONTACT.tel}">${esc(CONTACT.telefoon)}</a>.</p>`}</div><div class="auth-info"><div class="story-photo">${img(contact?'team-2.jpg':'coaching.jpg')}</div><div class="eyebrow" style="margin-top:28px">${contact?'OPENINGSTIJDEN':'GOED OM TE WETEN'}</div><ul class="tick-list">${contact?'<li>Trainingstijden vind je in het lesrooster</li><li>Kerkewijk 68, Veenendaal · parkeren in de buurt</li><li>Vragen over je lidmaatschap regel je in de app</li>':'<li>Geen ervaring nodig, iedereen begint waar die staat</li><li>Kleine groepen met persoonlijke begeleiding</li><li>Kids vanaf 4 jaar, jeugd vanaf 12, volwassenen 15+</li><li>Na je proefles kies je zelf of je lid wordt</li>'}</ul>${contact?btn('lesrooster','Bekijk het rooster ↗','secondary'):btn('lesrooster','Bekijk het rooster ↗','secondary')}</div></div></section>`}
function terms(){const items=[['Lidmaatschap','Een lidmaatschap bij Strike Performance Club wordt afgesloten via de Strike-app. Het lidmaatschap is persoonlijk en niet overdraagbaar. De actuele abonnementsvormen, prijzen en looptijden vind je in de app.'],['Betaling','De contributie wordt maandelijks vooraf geïncasseerd via automatische incasso. Bij een mislukte incasso ontvang je een herinnering; bij uitblijvende betaling kan de toegang tot de lessen tijdelijk worden opgeschort.'],['Opzeggen en pauzeren','Opzeggen kan via de app met inachtneming van de opzegtermijn van één kalendermaand na afloop van de minimale looptijd. Tijdelijk pauzeren, bijvoorbeeld bij blessure of zwangerschap, is in overleg mogelijk.'],['Reserveren en annuleren','Lessen reserveer je via de app. Kun je niet komen? Annuleer dan tijdig, zodat je plek vrijkomt voor een ander lid. Bij herhaaldelijk niet verschijnen zonder annulering kan de reserveringsmogelijkheid worden beperkt.'],['Huisregels en veiligheid','Train met respect voor elkaar, de trainers en het materiaal. Volg de aanwijzingen van de trainer op. Sparren gebeurt alleen onder begeleiding en met de juiste bescherming. Meld blessures of gezondheidsklachten vooraf aan de trainer.'],['Aansprakelijkheid','Deelname aan de trainingen is op eigen risico. Strike Performance Club is niet aansprakelijk voor verlies, diefstal of schade aan eigendommen, noch voor blessures die niet het gevolg zijn van opzet of grove nalatigheid van de club.'],['Beeldmateriaal en privacy','Tijdens trainingen en evenementen kunnen foto’s en video’s worden gemaakt voor onze social media. Wil je niet in beeld? Geef dit aan bij de trainer. Persoonsgegevens verwerken we uitsluitend voor het uitvoeren van het lidmaatschap.']];return `${headerBlock('GOED GEREGELD','ALGEMENE <em>VOORWAARDEN.</em>','De afspraken die gelden voor trainen en lidmaatschap bij Strike Performance Club.')}<section class="section"><div class="wrap terms">${items.map((x,i)=>`<h3>${i+1}. ${x[0]}</h3><p>${x[1]}</p>`).join('')}<p class="legal-note">Concepttekst. De definitieve algemene voorwaarden worden door Strike Performance Club vastgesteld en vóór livegang hier geplaatst. Vragen? ${link('contact','Neem contact op')}.</p></div></section>`}
function socials(){return `${headerBlock('VOLG DE CLUB','STRIKE <em>SOCIALS.</em>','Van trainingsmomenten en succesverhalen tot praktische tips: blijf verbonden met de club.')}<section class="section"><div class="wrap">${section('BEHIND THE GLOVES','DE CLUB IN<br><em>BEELD.</em>','De officiële accounts en rechten op het beeldmateriaal moeten voor publicatie worden bevestigd.')} ${photoWall()}<div class="social-grid"><div><span>◎</span><h3>Instagram</h3><p>Trainingen, community en korte updates.</p><small>Profiel-URL nog te bevestigen</small></div><div><span>▶</span><h3>TikTok</h3><p>Techniek, energie en momenten uit de gym.</p><small>Profiel-URL nog te bevestigen</small></div><div><span>▣</span><h3>Facebook</h3><p>Evenementen, nieuws en clubberichten.</p><small>Profiel-URL nog te bevestigen</small></div><div><span>◈</span><h3>YouTube</h3><p>Langere video’s, verhalen en trainingsuitleg.</p><small>Profiel-URL nog te bevestigen</small></div></div><div class="source-line"><b>Inspiratiebron:</b> <a href="https://coachingbyabood.nl/" target="_blank" rel="noopener">Coaching by Abood ↗</a> · Gebruik socialfoto’s pas na toestemming van rechthebbenden.</div></div></section>`}
const views={'home':home,'trainingen':trainingPage,'lesrooster':roster,'gratis-proefles':()=>formPage('proefles'),'contact':()=>formPage('contact'),'over-ons':about,'voorwaarden':terms,'abonnementen':prices};
function render(){const {page}=getPage();root.innerHTML=nav()+`<main id="main">${views[page]()}</main>`+footer();document.title=(PAGES.find(x=>x[0]===page)?.[1]||'Home')+' | Strike Performance Club — '+(theme==='arena'?'Arena':'Elevate'); const t=getPage().params.get('t');const anchor=t&&document.getElementById('training-'+t);if(anchor){anchor.scrollIntoView({block:'start'})}else if(isSingle){window.scrollTo({top:0,behavior:'instant'})}}
function toast(t){const el=$('#toast');if(!el)return;el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4800)}
function dialog(title,body,actions=''){const el=$('#modal');el.innerHTML=`<div class="dialog-back" data-action="close-modal"><div class="dialog-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}" onclick="event.stopPropagation()"><button class="dialog-x" data-action="close-modal" aria-label="Sluiten">×</button><div class="eyebrow">STRIKE PERFORMANCE CLUB</div><h2>${title}</h2><div class="dialog-body">${body}</div><div class="dialog-actions">${actions||'<button class="btn btn-accent" data-action="close-modal">Sluiten ↗</button>'}</div></div></div>`}
function newBooking(b){selectedClass=b;const m=member();if(!m){pendingBooking=b;try{sessionStorage.setItem('strike-pending',JSON.stringify(b))}catch{}go('login');return}const full=b.full==='1';dialog(full?'WACHTLIJST.':'BEVESTIG JE PLEK.',`<div class="reservation-detail"><span>LESSENOVERZICHT</span><h3>${esc(b.name)}</h3><p>${esc(b.date)} · ${esc(b.time)} uur · 60 minuten</p><p>${full?'De les is vol. Je kunt jezelf aanmelden voor de wachtlijst.':'Er is nog plek voor deze les.'}</p><div class="member-line">Deelnemer: <b>${esc(m.name)}</b><br>E-mailadres: ${esc(m.email)}</div><small>Demo: deze reservering wordt alleen op dit apparaat opgeslagen. Er wordt nog geen e-mail verstuurd.</small></div>`,`<button class="btn btn-accent" data-action="confirm-booking">${full?'Plaats mij op de wachtlijst':'Bevestig reservering'} ↗</button><button class="btn btn-outline" data-action="close-modal">Annuleren</button>`)}
function go(page,query=''){location.href=path(page,query);if(isSingle&&location.hash==='#'+page){render()}}
function finishBooking(){const m=member(),b=selectedClass;if(!m||!b)return;const current=load(BOOKINGS,[]);if(current.some(x=>x.key===b.key&&x.email===m.email)){dialog('AL GERESERVEERD','Je staat al ingeschreven voor deze les.');return}const record={...b,email:m.email,waitlist:b.full==='1'};save(BOOKINGS,[...current,record]);selectedClass=null;render();dialog('RESERVERING IN DEMO VASTGELEGD.',`<div class="mail-example"><b>Voorbeeld van de automatische bevestigingsmail</b><p>Onderwerp: Je Strike-reservering is bevestigd</p><p>Hoi ${esc(m.name.split(' ')[0])},<br>Je ${record.waitlist?'aanmelding voor de wachtlijst':'plek'} voor <strong>${esc(record.name)}</strong> op <strong>${esc(record.date)} om ${esc(record.time)} uur</strong> is in deze demo opgeslagen.</p><p>In de live versie ontvang je dit per e-mail en zien alle leden dezelfde actuele bezetting.</p></div>`,`<button class="btn btn-accent" data-action="go-members">Bekijk mijn lessen ↗</button><button class="btn btn-outline" data-action="close-modal">Sluiten</button>`)}
function updateTotals(){const s=COSTS[signupPlan],b=signupPlan==='six'||bandages;$('#plan-summary-name').textContent=s.name;$('#plan-monthly').textContent=money(s.amount);$('#plan-duration').textContent=signupPlan==='flex'?'Maandelijks opzegbaar':s.term+' maanden';$('#plan-bands').textContent=signupPlan==='six'?'Gratis':b?'€ 9,95':'Niet toegevoegd';$('#plan-total').textContent=money(s.amount+(signupPlan!=='six'&&bandages?9.95:0));const check=$('#bandage-check');if(check){check.checked=b;check.disabled=signupPlan==='six'}$$('.plan-choice').forEach(el=>el.classList.toggle('selected',el.dataset.plan===signupPlan))}
root.addEventListener('click',e=>{const bt=e.target.closest('[data-action]');if(!bt)return;const x=bt.dataset.action;
if(x==='close-modal'){$('#modal').innerHTML='';return}
if(x==='shop-link'){dialog('SHOPIFY-WINKEL VOLGT.',`<p>De shop komt op <strong>shop.strikeperformanceclub.nl</strong>. Zodra de winkel bestaat, leiden de knoppen rechtstreeks naar echte Shopify-productpagina’s en de veilige Shopify-checkout.</p><p>De 5% ledenkorting moet worden toegekend via een veilig geverifieerde actieve lidstatus, niet alleen via een kortingscode in de browser.</p>`);return}
if(x==='pick-plan'){signupPlan=bt.dataset.plan;updateTotals();return}
if(x==='prev-week'||x==='next-week'||x==='this-week'){weekIndex=x==='this-week'?0:Math.max(0,Math.min(6,weekIndex+(x==='next-week'?1:-1)));render();return}
if(x==='day'){dayIndex=+bt.dataset.day;render();return}
if(x==='filter'){catFilter=bt.dataset.cat;render();return}
if(x==='reserve'){newBooking({...bt.dataset,full:bt.dataset.full});return}
if(x==='confirm-booking'){finishBooking();return}
if(x==='go-members'){$('#modal').innerHTML='';go('leden');return}
if(x==='cancel'){const m=member();if(!m)return;save(BOOKINGS,load(BOOKINGS,[]).filter(b=>!(b.email===m.email&&b.key===bt.dataset.key)));render();toast('Je demo-reservering is geannuleerd.');return}
if(x==='logout'){remove(SESSION);render();toast('Je bent uitgelogd uit de demo.');return}
});
root.addEventListener('change',e=>{if(e.target.id==='bandage-check'){bandages=e.target.checked;updateTotals()}});
root.addEventListener('submit',e=>{if(!['login-form','signup-form','lead-form','log-form'].includes(e.target.id))return;e.preventDefault();const f=e.target,fd=new FormData(f);
if(f.id==='signup-form'){let email=String(fd.get('email')).trim().toLowerCase(),name=String(fd.get('name')).trim();const a={email,name,plan:signupPlan,bandages:signupPlan==='six'||bandages,created:new Date().toISOString(),status:'DEMO'};save(KEY,a);save(SESSION,{email});toast('Demo-abonnement geactiveerd; er is géén betaling uitgevoerd.');go('leden');return}
if(f.id==='login-form'){const a=load(KEY,null),email=String(fd.get('email')).trim().toLowerCase();if(!a||a.email!==email){dialog('GEEN DEMO-ACCOUNT GEVONDEN.','Schrijf je eerst in en rond de gesimuleerde abonnementbetaling af. Deze login werkt alleen op het apparaat waarop je de demo-inschrijving hebt gedaan.','<button class="btn btn-accent" data-action="go-signup">Schrijf mij in ↗</button>');return}save(SESSION,{email});let pending=pendingBooking;try{pending=pending||JSON.parse(sessionStorage.getItem('strike-pending')||'null');sessionStorage.removeItem('strike-pending')}catch{}pendingBooking=null;if(pending){selectedClass=null;go('lesrooster');setTimeout(()=>newBooking(pending),200)}else{go('leden')}return}
if(f.id==='lead-form'){const who=esc(fd.get('name')),name=f.dataset.kind;dialog('AANVRAAGVOORBEELD.',`<p>Dank je, ${who}! Dit is een <b>presentatiedemo</b>: jouw ${name==='proefles'?'gratis proefles':name==='intake'?'gratis intake':'contactbericht'} is niet echt verstuurd of geboekt.</p><p>Na de koppeling met de mailservice ontvangt de aanvrager automatisch een bevestigingsmail. De club ontvangt een melding en kan de aanvraag verwerken.</p>`);f.reset();return}
if(f.id==='log-form'){const m=member();if(!m)return;save(LOG,[...load(LOG,[]),{email:m.email,date:dFmt(today(),{day:'numeric',month:'long',year:'numeric'}),type:fd.get('type'),level:fd.get('level'),note:String(fd.get('note')).slice(0,500)}]);render();toast('Training toegevoegd aan je lokale demo-log.');return}
});
root.addEventListener('click',e=>{const bt=e.target.closest('[data-action="go-signup"]');if(bt){go('inschrijven')}});
window.addEventListener('hashchange',()=>{if(isSingle){weekIndex=0;catFilter='Alles';render()}});
render();
})();
</script></body></html>
